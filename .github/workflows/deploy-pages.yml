name: Deploy Atlas to GitHub Pages

on:
  push:
    branches:
      [
        main,
        cursor/interactive-route-editor-9bbe,
        cursor/route-control-suite-9bbe,
      ]
    paths:
      - "atlas/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - name: Install & build
        working-directory: atlas
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: atlas/dist
          force_orphan: true
